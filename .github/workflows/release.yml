name: Release

# Publishes to npm and then to the MCP Registry when a version tag is pushed:
#   npm version patch && git push --follow-tags
# Needs one repository secret: NPM_TOKEN (an npm automation token with publish rights to the scope).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance and MCP Registry sign-in both use GitHub's OIDC token
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json and server.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          server="$(node -p "require('./server.json').version")"
          bundled="$(node -p "require('./server.json').packages[0].version")"
          for found in "$package" "$server" "$bundled"; do
            if [ "$found" != "$tag" ]; then
              echo "Version mismatch: tag $tag, package.json $package, server.json $server / $bundled" >&2
              exit 1
            fi
          done

      - run: npm run check

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
